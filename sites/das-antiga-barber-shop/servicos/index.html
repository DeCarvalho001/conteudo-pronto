<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviços &amp; Preços — Das Antiga Barber Shop</title><meta name="description" content="Tabela completa de serviços da Das Antiga Barber Shop.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--surface:#171410;--txt:#efe9dc;--acc:#c9a227;
--onacc:#141109;--muted:#a89f8d;--line:#262019;--line2:#453d31;
--red:#8c2f2f;--blue:#27415e;--rad:14px;
/* usadas no CSS e que faltavam no :root — sem elas a barra do depoimento
   some, as estrelas perdem o dourado e os chips ficam sem fundo */
--chip:rgba(23,20,16,.85);--gold:#c9a227;
/* ── escala tipográfica: 7 degraus, razão ~1.25. NENHUM tamanho fora daqui ── */
--t-xs:.75rem;--t-sm:.875rem;--t-base:1rem;--t-md:1.125rem;--t-lg:1.375rem;
--t-xl:1.75rem;--t-2xl:2.25rem;
/* ── espaçamento: base 4px ── */
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;
/* ── alvo de toque mínimo (dedo, não mouse) ── */
--toque:44px;
/* ── sombra em camadas: uma só fica chapada ── */
--sombra:0 1px 2px rgba(0,0,0,.28),0 8px 24px rgba(0,0,0,.22);
--sombra-alta:0 2px 4px rgba(0,0,0,.30),0 14px 40px rgba(0,0,0,.28)}

*{margin:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);
font:var(--t-base)/1.65 Inter,system-ui,-apple-system,sans-serif;
text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:0 var(--s5)}

/* ── tipografia: tracking ótico — display aperta, caixa-alta pequena folga ── */
h1,h2,h3{font-family:"Bebas Neue",Inter,sans-serif;letter-spacing:.03em;
font-weight:400;
text-wrap:balance;line-height:1.15}
h1{font-size:clamp(2.25rem,7vw,4rem);line-height:1.04;letter-spacing:-.015em}
/* h2 inteiro na cor de acento é assinatura de template. O acento vira um
   filete curto acima do título — detalhe editorial, sem tocar no HTML. */
h2{font-size:var(--t-2xl);color:var(--txt);margin:0 0 var(--s5)}
h2::before{content:'';display:block;width:38px;height:2px;background:var(--acc);margin-bottom:var(--s3);border-radius:2px}
h3{font-size:var(--t-lg)}
p{text-wrap:pretty}

section{padding:var(--s8) 0}
/* o delta de fundo entre bg e surface é ~1.1:1 (invisível). A divisão quem
   entrega é a hairline — o olho lê o corte sem precisar de contraste. */
.alt{background:var(--surface);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.pole{height:8px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#efe9dc 14px 24px,var(--blue) 24px 34px,#efe9dc 34px 44px);opacity:.85}

/* ── navegação: todo clicável com 44px de alvo ── */
nav{position:sticky;top:0;z-index:50;background:rgba(12,11,9,.92);backdrop-filter:blur(10px);
border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s5)}
nav a{color:var(--txt);text-decoration:none;font-weight:600;font-size:var(--t-sm);
display:inline-flex;align-items:center;min-height:var(--toque)}
nav .links{display:flex;gap:var(--s2);margin-left:auto;flex-wrap:wrap}
nav .links a:not(.ctan){padding:0 var(--s3);border:1px solid var(--line2);border-radius:99px;
transition:border-color .18s,color .18s}
nav .links a:not(.ctan):hover{border-color:var(--acc);color:var(--acc)}
nav .ctan{background:var(--acc);color:var(--onacc);padding:0 var(--s4);border-radius:8px}
.marca{text-decoration:none;color:inherit}
.logo{width:var(--toque);height:var(--toque);border-radius:10px;object-fit:cover}
.logo.mono{display:flex;align-items:center;justify-content:center;background:var(--acc);
color:var(--onacc);font-family:"Bebas Neue";font-size:var(--t-lg)}

header{min-height:78vh;display:flex;align-items:center;text-align:center}
header .wrap{padding:var(--s9) var(--s5)}
.sub{color:var(--muted);font-size:var(--t-md);max-width:52ch;margin:var(--s4) auto var(--s6)}
.ic{display:inline-block;vertical-align:-.18em;flex:none}
.chip{display:inline-flex;align-items:center;gap:var(--s2);background:var(--chip);border:1px solid var(--line2);
border-radius:999px;padding:var(--s2) var(--s3);margin:var(--s1);font-size:var(--t-sm)}

/* ── botões: alvo generoso, sombra em camadas, estado de foco visível ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
background:var(--acc);color:var(--onacc);font-weight:800;text-decoration:none;
padding:var(--s3) var(--s6);min-height:52px;border-radius:10px;font-size:var(--t-md);
box-shadow:var(--sombra);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sombra-alta)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.sm{padding:var(--s2) var(--s4);min-height:var(--toque);font-size:var(--t-sm)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);
padding:var(--s5)}

/* ── tabela de preços: dígitos tabulares alinham em coluna (detalhe de ofício) ── */
.tabela .row{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) 0;
border-bottom:1px dashed var(--line2);font-size:var(--t-base)}
.tabela .row:last-child{border:none}
.tabela i{flex:1;border-bottom:2px dotted var(--line2)}
.tabela b,.combo b,.plano .pp{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tabela b{color:var(--acc);font-size:var(--t-md)}
.combo{display:flex;justify-content:space-between;align-items:center;
margin-top:var(--s3);border-color:var(--acc)}
.combo b{color:var(--acc);font-size:var(--t-md)}

.planos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s4)}
.plano{text-align:center}
.plano .pp{font-size:var(--t-xl);color:var(--acc);font-weight:800;margin:var(--s2) 0 var(--s4)}
.motivos{margin-top:var(--s6)}.m b{color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s3)}
.grid img{width:100%;aspect-ratio:4/5;height:auto;object-fit:cover;object-position:center 30%;
border-radius:12px}
/* a ÚNICA seção que quebra o container. Sem um quebra-ritmo, seis seções de
   anatomia idêntica leem como gerador — com um, a página respira. */
.bleed{max-width:none;padding:0}
/* a seção full-bleed anula o próprio padding e devolve o respiro POR DENTRO —
   senão a listra flutua 64px pra dentro em vez de encostar na borda. E a
   hairline sai: a listra já é o divisor, as duas juntas viram redundância. */
.sec-bleed{padding:0;border-top:0;border-bottom:0}
.sec-bleed .bleed{padding:var(--s8) 0}
.mosaic--bleed,.grid--bleed{padding:0 var(--s2)}
/* full-bleed sem subir a contagem de colunas vira slideshow em monitor grande */
@media(min-width:1200px){.mosaic--bleed{column-count:4}}
@media(min-width:1600px){.mosaic--bleed{column-count:5}}
.mosaic--bleed img,.grid--bleed img{border-radius:6px}
#galeria{padding:0 0 var(--s7)}
#galeria .tit{padding-top:var(--s7)}
.bleed .tit{max-width:1020px;margin:0 auto var(--s5);padding:0 var(--s5)}
.mosaic{column-count:3;column-gap:var(--s3)}
.mosaic img{width:100%;margin:0 0 var(--s3);border-radius:12px;display:block}
@media(max-width:759px){.mosaic{column-count:2}}

/* a aspa é ORNAMENTO, não caractere no texto — assim nunca duplica e
   ainda vira detalhe editorial */
blockquote{position:relative;background:var(--bg);border-left:3px solid var(--acc);border-radius:0 12px 12px 0;
padding:var(--s4) var(--s5);margin:0 0 var(--s3);color:var(--txt);font-style:italic;opacity:.92}
blockquote::before{content:'“';position:absolute;top:-.18em;left:.18em;
font-family:"Bebas Neue",Georgia,serif;font-size:calc(var(--t-2xl) * 1.55);color:var(--acc);
opacity:.22;line-height:1;pointer-events:none}
blockquote p{position:relative}
cite{display:block;margin-top:var(--s2);font-style:normal;color:var(--muted);font-size:var(--t-sm)}
.lead{color:var(--muted);max-width:62ch}.sobre{margin:var(--s4) auto 0}
.mini{color:var(--muted);font-size:var(--t-sm);opacity:.85}.mini a{color:var(--acc)}
/* card de endereço no lugar do iframe do Google: carrega instantâneo, não
   vaza UI nem cookie de terceiro, e não abre um buraco claro no tema escuro */
.ondecx{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
gap:var(--s5);background:var(--surface);border:1px solid var(--line);
border-radius:var(--rad);padding:var(--s6)}
.onde-txt b{display:block;font-size:var(--t-md);margin-bottom:var(--s2)}
.onde-txt span{display:block;color:var(--muted);font-size:var(--t-sm)}
iframe{width:100%;height:380px;border:0;border-radius:var(--rad)}

footer{padding:var(--s7) 0 var(--s9);border-top:1px solid var(--line);color:var(--muted);
font-size:var(--t-sm)}
footer a{color:var(--acc);text-decoration:none;display:inline-flex;align-items:center;
min-height:var(--toque)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:var(--s3);
padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
background:rgba(12,11,9,.95);border-top:1px solid var(--line)}
.bar .btn{flex:1;text-align:center}

.dur{display:block;font-size:var(--t-xs);color:var(--muted);font-weight:400;margin-top:2px}
/* grid, não flex: com 3 filhos diretos o flex punha monograma, nome e
   especialidade na MESMA linha. Aqui o disco ocupa as duas linhas à esquerda. */
.eq{display:grid;grid-template-columns:auto 1fr;column-gap:var(--s4);
align-items:center;text-align:left}
.mono-b{grid-row:1/span 2}
.eq b{grid-column:2;align-self:end}
.eq small{grid-column:2;align-self:start}
/* monograma: a inicial desenhada no display do tema. Artesanal — emoji não é. */
.mono-b{flex:none;width:52px;height:52px;border-radius:50%;display:flex;
align-items:center;justify-content:center;background:var(--bg);
border:1.5px solid var(--acc);color:var(--acc);
font-family:"Bebas Neue",Georgia,serif;font-size:var(--t-lg);line-height:1}
.eq b{display:block;font-size:var(--t-base)}
.eq small{color:var(--muted);font-size:var(--t-sm)}

.provatop{max-width:640px;margin:0 auto;padding:var(--s4) var(--s5) 0}
.provatop .cx{background:var(--surface);border:1px solid var(--line);
border-left:3px solid var(--gold);border-radius:14px;padding:var(--s4)}
.provatop .est{color:var(--gold);font-size:var(--t-sm);letter-spacing:.08em}
.provatop p{margin-top:var(--s2);font-size:var(--t-base);line-height:1.5}
/* .qn foi absorvido por <cite>: dois markups pro mesmo dado é dívida */
.demo{background:var(--red);color:#fff;text-align:center;font-size:var(--t-sm);
padding:var(--s2);letter-spacing:.02em}

/* layout split (revista) */
.hsplit{min-height:auto}
.hsplit .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:var(--s6);
align-items:center;text-align:left;padding:var(--s8) var(--s5)}
.hsplit h1{margin-bottom:var(--s1)}.hsplit .sub{margin:var(--s3) 0 var(--s5) 0}
.hsplit .col-img{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.hsplit .col-img img{width:100%;height:100%;min-height:150px;max-height:260px;
object-fit:cover;object-position:center 30%;border-radius:var(--rad)}
.hsplit .col-img img:first-child{grid-row:span 2;max-height:530px}

@media(max-width:759px){
nav .wrap{flex-wrap:wrap;gap:var(--s2)}
nav .links{margin-left:0;gap:var(--s2);width:100%}
nav .links a:not(.ctan){font-size:var(--t-xs);padding:0 var(--s3)}
section{padding:var(--s7) 0}
header .wrap{padding:var(--s8) var(--s5)}
.hsplit .wrap{grid-template-columns:1fr;text-align:center;padding:var(--s7) var(--s5)}
.hsplit .sub{margin:var(--s3) auto var(--s5)}
.hsplit .col-img{order:-1}}

@media(min-width:760px){.bar{display:none}footer{padding-bottom:var(--s7)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* tokens do sistema — este bloco tinha tamanhos e espaços próprios e por
   isso as subpáginas serviam 10 tamanhos de fonte contra 8 da home */
.pg{padding:var(--s7) 0 var(--s5)}
.pg h1{margin-bottom:var(--s2)}
/* o mesmo filete do h2 da home — assinatura tem de valer no site inteiro */
.pg h1::before{content:'';display:block;width:38px;height:2px;background:var(--acc);margin-bottom:var(--s3);border-radius:2px}
.pg .sub{color:var(--muted);margin-bottom:var(--s5)}
.pg .sub:empty{display:none}
.voltar{display:inline-flex;align-items:center;min-height:var(--toque);margin:var(--s3) 0 0;color:var(--muted);text-decoration:none;font-size:var(--t-sm)}
.voltar:hover{color:var(--acc)}
</style></head><body>
